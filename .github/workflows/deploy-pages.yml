name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Inject GitHub Token
        run: |
          if [ -z "${{ secrets.MY_GITHUB_TOKEN }}" ]; then
            echo "ERROR: MY_GITHUB_TOKEN secret is not set!"
            exit 1
          fi
          echo "Secret is set (length: ${#MY_GITHUB_TOKEN})"
          # Use Python for more reliable string replacement
          python3 << 'PYTHON_SCRIPT'
          import os
          import sys
          
          token = os.environ.get('MY_GITHUB_TOKEN', '')
          if not token:
              print("ERROR: MY_GITHUB_TOKEN environment variable is empty!")
              sys.exit(1)
          
          print(f"Token length: {len(token)}")
          print(f"Token starts with: {token[:10]}...")
          
          try:
              with open('index.html', 'r', encoding='utf-8') as f:
                  content = f.read()
              
              if 'GITHUB_TOKEN_PLACEHOLDER' not in content:
                  print("WARNING: GITHUB_TOKEN_PLACEHOLDER not found in index.html")
                  print("Searching for variations...")
                  if 'GITHUB_TOKEN' in content:
                      print("Found GITHUB_TOKEN in file, but not the placeholder")
              else:
                  print("Found GITHUB_TOKEN_PLACEHOLDER, replacing...")
                  content = content.replace('GITHUB_TOKEN_PLACEHOLDER', token)
                  
                  with open('index.html', 'w', encoding='utf-8') as f:
                      f.write(content)
                  
                  # Verify replacement worked
                  if 'GITHUB_TOKEN_PLACEHOLDER' in content:
                      print("ERROR: Token replacement failed - placeholder still found!")
                      sys.exit(1)
                  
                  # Verify token is in the file
                  if token not in content:
                      print("ERROR: Token not found in file after replacement!")
                      sys.exit(1)
                  
                  print("Token successfully injected and verified")
                  
                  # Double-check by reading the file back
                  with open('index.html', 'r', encoding='utf-8') as f:
                      verify_content = f.read()
                  if 'GITHUB_TOKEN_PLACEHOLDER' in verify_content:
                      print("ERROR: Verification failed - placeholder still in file!")
                      sys.exit(1)
                  if token not in verify_content:
                      print("ERROR: Verification failed - token not in file!")
                      sys.exit(1)
                  print("Final verification passed - file is ready for deployment")
          except Exception as e:
              print(f"ERROR: {e}")
              sys.exit(1)
          PYTHON_SCRIPT
        env:
          MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        shell: bash
      
      - name: Verify file before deployment
        run: |
          if grep -q "GITHUB_TOKEN_PLACEHOLDER" index.html; then
            echo "ERROR: Placeholder still found in index.html!"
            exit 1
          fi
          echo "✓ Verified: Placeholder has been replaced"
          # Show first 50 chars of the token line to verify
          grep "const GITHUB_TOKEN" index.html | head -c 80
          echo ""
        shell: bash
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Verify token replacement before upload
        run: |
          echo "=== Verifying index.html before upload ==="
          if grep -q "GITHUB_TOKEN_PLACEHOLDER" index.html; then
            echo "❌ ERROR: Placeholder still found!"
            exit 1
          fi
          echo "✓ Placeholder has been replaced"
          echo ""
          echo "Token line in file:"
          grep "const GITHUB_TOKEN" index.html | head -c 100
          echo ""
          echo ""
          echo "Checking token starts with 'github_pat':"
          if grep -q "const GITHUB_TOKEN = 'github_pat" index.html; then
            echo "✓ Token format is correct"
          else
            echo "⚠ WARNING: Token doesn't start with 'github_pat'"
          fi
        shell: bash
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
