name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Inject GitHub Token
        run: |
          if [ -z "${{ secrets.MY_GITHUB_TOKEN }}" ]; then
            echo "ERROR: MY_GITHUB_TOKEN secret is not set!"
            exit 1
          fi
          echo "Secret is set, replacing placeholder in index.html..."
          # Use Python for reliable replacement (handles special chars and quotes)
          python3 << 'PYTHON_SCRIPT'
          import os
          import re
          
          token = os.environ.get('MY_GITHUB_TOKEN', '')
          if not token:
              print("ERROR: MY_GITHUB_TOKEN not found in environment!")
              exit(1)
          
          print(f"Token length: {len(token)}")
          print(f"Token starts with: {token[:15]}...")
          
          with open('index.html', 'r', encoding='utf-8') as f:
              content = f.read()
          
          # Replace the placeholder - try multiple patterns
          original_content = content
          
          # Pattern 1: 'GITHUB_TOKEN_PLACEHOLDER'
          if "'GITHUB_TOKEN_PLACEHOLDER'" in content:
              content = content.replace("'GITHUB_TOKEN_PLACEHOLDER'", f"'{token}'")
              print("✓ Replaced 'GITHUB_TOKEN_PLACEHOLDER'")
          
          # Pattern 2: "GITHUB_TOKEN_PLACEHOLDER"
          if '"GITHUB_TOKEN_PLACEHOLDER"' in content:
              content = content.replace('"GITHUB_TOKEN_PLACEHOLDER"', f"'{token}'")
              print("✓ Replaced \"GITHUB_TOKEN_PLACEHOLDER\"")
          
          # Pattern 3: Just the word (no quotes)
          if 'GITHUB_TOKEN_PLACEHOLDER' in content and content == original_content:
              # Last resort - replace without quotes
              content = content.replace('GITHUB_TOKEN_PLACEHOLDER', token)
              print("✓ Replaced GITHUB_TOKEN_PLACEHOLDER (no quotes)")
          
          if content == original_content:
              print("ERROR: No replacement was made!")
              print("Searching for token references in file...")
              if 'GITHUB_TOKEN' in content:
                  # Show context around GITHUB_TOKEN
                  idx = content.find('GITHUB_TOKEN')
                  print(f"Found GITHUB_TOKEN at position {idx}")
                  print(f"Context: {content[max(0, idx-50):idx+100]}")
              exit(1)
          
          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(content)
          
          # Verify replacement
          if 'GITHUB_TOKEN_PLACEHOLDER' in content:
              print("ERROR: Placeholder still found after replacement!")
              exit(1)
          if token not in content:
              print("ERROR: Token not found in file after replacement!")
              exit(1)
          
          # Show proof of replacement
          token_line = [line for line in content.split('\n') if 'GITHUB_TOKEN' in line and 'const' in line]
          if token_line:
              print(f"✓ Token line: {token_line[0][:80]}...")
          
          print("✓ Token replaced and verified successfully")
          PYTHON_SCRIPT
        env:
          MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        shell: bash
      
      - name: Verify file before deployment
        run: |
          if grep -q "GITHUB_TOKEN_PLACEHOLDER" index.html; then
            echo "ERROR: Placeholder still found in index.html!"
            exit 1
          fi
          echo "✓ Verified: Placeholder has been replaced"
          # Show first 50 chars of the token line to verify
          grep "const GITHUB_TOKEN" index.html | head -c 80
          echo ""
        shell: bash
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Verify token replacement before upload
        run: |
          echo "=== Verifying index.html before upload ==="
          if grep -q "GITHUB_TOKEN_PLACEHOLDER" index.html; then
            echo "❌ ERROR: Placeholder still found!"
            exit 1
          fi
          echo "✓ Placeholder has been replaced"
          echo ""
          echo "Token line in file:"
          grep "const GITHUB_TOKEN" index.html | head -c 100
          echo ""
          echo ""
          echo "Checking token starts with 'github_pat':"
          if grep -q "const GITHUB_TOKEN = 'github_pat" index.html; then
            echo "✓ Token format is correct"
          else
            echo "⚠ WARNING: Token doesn't start with 'github_pat'"
          fi
        shell: bash
      
      - name: Verify artifact contents
        run: |
          echo "=== Files that will be deployed ==="
          ls -la
          echo ""
          echo "=== Contents of index.html (first 50 lines) ==="
          head -50 index.html | grep -A 5 -B 5 "GITHUB_TOKEN\|JSONBIN" || echo "No matches in first 50 lines"
          echo ""
          echo "=== Checking for JSONBin references ==="
          if grep -q "JSONBIN" index.html; then
            echo "❌ ERROR: JSONBin found in file!"
            exit 1
          fi
          echo "✓ No JSONBin references found"
          echo ""
          echo "=== Checking for GitHub token ==="
          if grep -q "GITHUB_TOKEN_PLACEHOLDER" index.html; then
            echo "❌ ERROR: Placeholder still found!"
            exit 1
          fi
          if grep -q "github_pat" index.html; then
            echo "✓ GitHub token found in file"
          else
            echo "⚠ WARNING: GitHub token pattern not found"
          fi
        shell: bash
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
