<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Sign-In</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .view-toggle {
            text-align: center;
            margin-bottom: 20px;
        }

        .view-toggle button {
            background: #f0f0f0;
            border: 2px solid #667eea;
            color: #667eea;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin: 0 5px;
            transition: all 0.3s;
        }

        .view-toggle button.active {
            background: #667eea;
            color: white;
        }

        .view-toggle button:hover {
            opacity: 0.8;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .required {
            color: #e74c3c;
        }

        button.submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button.submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button.submit-btn:active {
            transform: translateY(0);
        }

        button.submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            margin-top: 10px;
        }

        /* Attendance List Styles */
        .attendance-view {
            display: none;
        }

        .attendance-view.active {
            display: block;
        }

        .stats {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .stats h2 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 5px;
        }

        .stats p {
            color: #666;
            font-size: 14px;
        }

        .attendance-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .attendance-item {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .attendance-item:last-child {
            border-bottom: none;
        }

        .attendance-item:hover {
            background: #f8f9fa;
        }

        .attendance-name {
            font-weight: 500;
            color: #333;
        }

        .attendance-time {
            color: #666;
            font-size: 14px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
        }

        .refresh-btn:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Event Sign-In</h1>
        
        <div class="view-toggle">
            <button id="formViewBtn" class="active" onclick="showView('form')">Sign In</button>
            <button id="attendanceViewBtn" onclick="showView('attendance')">View Attendance</button>
        </div>

        <!-- Form View -->
        <div id="formView" class="form-view">
            <p class="subtitle">Please fill out the form below to check in</p>

            <div id="successMessage" class="success-message">
                ✓ Thank you! Your sign-in was successful.
            </div>

            <div id="errorMessage" class="error-message">
                There was an error submitting your form. Please try again.
            </div>

            <form id="signInForm">
                <div class="form-group">
                    <label for="firstName">First Name <span class="required">*</span></label>
                    <input type="text" id="firstName" name="firstName" required autocomplete="given-name">
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name <span class="required">*</span></label>
                    <input type="text" id="lastName" name="lastName" required autocomplete="family-name">
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">Sign In</button>
                <div class="loading" id="loading">Submitting...</div>
            </form>
        </div>

        <!-- Attendance View -->
        <div id="attendanceView" class="attendance-view">
            <div class="stats">
                <h2 id="totalCount">0</h2>
                <p>Total Sign-Ins</p>
            </div>

            <button class="refresh-btn" onclick="loadAttendance()">Refresh List</button>

            <div class="attendance-list" id="attendanceList">
                <div class="empty-state">Loading attendance...</div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // GITHUB REPO SETUP INSTRUCTIONS:
        // ============================================
        // 1. Go to https://github.com/settings/tokens
        // 2. Click "Generate new token" -> "Generate new token (classic)"
        // 3. Name it "Event Sign-In" and check the "repo" scope (full control)
        // 4. Copy the token and paste it below in GITHUB_TOKEN
        // 5. Fill in your GitHub username and repo name below
        // 6. Create a file called "attendance.json" in your repo with: {"submissions": []}
        //    (Or change the JSON_FILE_PATH below to match your file name)
        // ============================================
        
        const GITHUB_USERNAME = 'Dkent-strg-pa'; // Your GitHub username
        const GITHUB_REPO = 'Annual-Meeting-Sign-In'; // Your repository name (e.g., "my-signin-app")
        const GITHUB_TOKEN = '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'; // Your GitHub Personal Access Token
        const JSON_FILE_PATH = 'attendance.json'; // Path to JSON file in your repo
        
        const form = document.getElementById('signInForm');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const successMessage = document.getElementById('successMessage');
        const errorMessage = document.getElementById('errorMessage');

        function showView(view) {
            const formView = document.getElementById('formView');
            const attendanceView = document.getElementById('attendanceView');
            const formBtn = document.getElementById('formViewBtn');
            const attendanceBtn = document.getElementById('attendanceViewBtn');

            if (view === 'form') {
                formView.style.display = 'block';
                attendanceView.classList.remove('active');
                formBtn.classList.add('active');
                attendanceBtn.classList.remove('active');
            } else {
                formView.style.display = 'none';
                attendanceView.classList.add('active');
                formBtn.classList.remove('active');
                attendanceBtn.classList.add('active');
                loadAttendance();
            }
        }

        async function loadAttendance() {
            const attendanceList = document.getElementById('attendanceList');
            const totalCount = document.getElementById('totalCount');
            
            attendanceList.innerHTML = '<div class="empty-state">Loading attendance...</div>';
            errorMessage.style.display = 'none'; // Hide any previous errors

            // Check if GitHub is configured
            if (GITHUB_USERNAME === 'YOUR_USERNAME_HERE' || GITHUB_REPO === 'YOUR_REPO_NAME_HERE' || 
                GITHUB_TOKEN === 'YOUR_GITHUB_TOKEN_HERE' || GITHUB_TOKEN === '') {
                errorMessage.textContent = 'GitHub not configured. Please set GITHUB_USERNAME, GITHUB_REPO, and GITHUB_TOKEN in the code.';
                errorMessage.style.display = 'block';
                // Show empty list instead of localStorage when not configured
                displayAttendance([]);
                return;
            }

            try {
                // Load from GitHub repo JSON file
                const response = await fetch(
                    `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${JSON_FILE_PATH}`,
                    {
                        headers: {
                            'Accept': 'application/vnd.github.v3.raw',
                            'Authorization': `token ${GITHUB_TOKEN}`
                        }
                    }
                );

                if (response.ok) {
                    const fileContent = await response.text();
                    const data = JSON.parse(fileContent);
                    const submissions = data.submissions || [];
                    displayAttendance(submissions);
                    errorMessage.style.display = 'none';
                } else if (response.status === 404) {
                    // File doesn't exist yet, start with empty array
                    displayAttendance([]);
                    errorMessage.style.display = 'none';
                } else {
                    throw new Error(`GitHub API error: ${response.status}`);
                }
            } catch (error) {
                console.error('Error loading attendance from GitHub:', error);
                errorMessage.textContent = `Error loading attendance: ${error.message}. Please check your GitHub configuration.`;
                errorMessage.style.display = 'block';
                // Show empty list on error instead of localStorage
                displayAttendance([]);
            }
        }

        function loadFromLocalStorage() {
            const stored = localStorage.getItem('eventAttendance');
            const submissions = stored ? JSON.parse(stored) : [];
            displayAttendance(submissions);
        }

        function displayAttendance(submissions) {
            const attendanceList = document.getElementById('attendanceList');
            const totalCount = document.getElementById('totalCount');

            totalCount.textContent = submissions.length;

            if (submissions.length === 0) {
                attendanceList.innerHTML = '<div class="empty-state">No sign-ins yet</div>';
                return;
            }

            // Sort by timestamp (newest first)
            submissions.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

            attendanceList.innerHTML = submissions.map((submission, index) => `
                <div class="attendance-item">
                    <div>
                        <div class="attendance-name">${submission.fullName}</div>
                        <div class="attendance-time">${submission.timestamp}</div>
                    </div>
                    <div style="color: #999; font-size: 12px;">#${submissions.length - index}</div>
                </div>
            `).join('');
        }

        async function saveSubmission(submission) {
            // Check if GitHub is configured
            if (GITHUB_USERNAME === 'YOUR_USERNAME_HERE' || GITHUB_REPO === 'YOUR_REPO_NAME_HERE' || 
                GITHUB_TOKEN === 'YOUR_GITHUB_TOKEN_HERE' || GITHUB_TOKEN === '') {
                throw new Error('GitHub not configured. Please set GITHUB_USERNAME, GITHUB_REPO, and GITHUB_TOKEN in the code.');
            }

            try {
                // First, get the current file to get its SHA (required for updating)
                const getResponse = await fetch(
                    `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${JSON_FILE_PATH}`,
                    {
                        headers: {
                            'Accept': 'application/vnd.github.v3+json',
                            'Authorization': `token ${GITHUB_TOKEN}`
                        }
                    }
                );

                let submissions = [];
                let sha = null;

                if (getResponse.ok) {
                    const fileData = await getResponse.json();
                    sha = fileData.sha; // Need SHA to update existing file
                    // Decode base64 content
                    const fileContent = atob(fileData.content.replace(/\s/g, ''));
                    const data = JSON.parse(fileContent);
                    submissions = data.submissions || [];
                } else if (getResponse.status === 404) {
                    // File doesn't exist yet, we'll create it
                    sha = null;
                } else {
                    throw new Error(`Failed to fetch file: ${getResponse.status}`);
                }

                // Add new submission
                submissions.push(submission);

                // Prepare the new file content
                const newContent = JSON.stringify({ submissions: submissions }, null, 2);
                const encodedContent = btoa(unescape(encodeURIComponent(newContent)));

                // Update or create the file
                const updateResponse = await fetch(
                    `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${JSON_FILE_PATH}`,
                    {
                        method: 'PUT',
                        headers: {
                            'Accept': 'application/vnd.github.v3+json',
                            'Authorization': `token ${GITHUB_TOKEN}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: `Add sign-in: ${submission.fullName}`,
                            content: encodedContent,
                            sha: sha // Include SHA if updating existing file
                        })
                    }
                );

                if (!updateResponse.ok) {
                    const errorData = await updateResponse.json().catch(() => ({}));
                    throw new Error(`Failed to update file: ${updateResponse.status} - ${errorData.message || 'Unknown error'}`);
                }

                // Successfully saved to GitHub repo
                return;
            } catch (error) {
                console.error('Error saving to GitHub repo:', error);
                // Don't use localStorage fallback - require GitHub to be configured
                throw error;
            }
        }

        // Helper function to clear old localStorage data
        // You can call this from browser console: clearOldData()
        function clearOldData() {
            localStorage.removeItem('eventAttendance');
            console.log('Old localStorage data cleared!');
            if (document.getElementById('attendanceView').classList.contains('active')) {
                loadAttendance();
            }
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Hide previous messages
            successMessage.style.display = 'none';
            errorMessage.style.display = 'none';
            
            // Show loading state
            submitBtn.disabled = true;
            loading.style.display = 'block';
            
            // Get form data
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const fullName = `${firstName} ${lastName}`;
            const timestamp = new Date().toLocaleString('en-US', { 
                year: 'numeric', 
                month: '2-digit', 
                day: '2-digit', 
                hour: '2-digit', 
                minute: '2-digit',
                second: '2-digit',
                hour12: true 
            });

            const submission = {
                firstName,
                lastName,
                fullName,
                timestamp,
                date: new Date().toISOString()
            };
            
            try {
                await saveSubmission(submission);
                successMessage.style.display = 'block';
                form.reset();
                window.scrollTo({ top: 0, behavior: 'smooth' });
                
                // Refresh attendance if viewing that tab
                if (document.getElementById('attendanceView').classList.contains('active')) {
                    loadAttendance();
                }
            } catch (error) {
                errorMessage.textContent = error.message || 'There was an error submitting your form. Please try again.';
                errorMessage.style.display = 'block';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } finally {
                submitBtn.disabled = false;
                loading.style.display = 'none';
            }
        });

        // Load attendance on page load if viewing that tab
        if (window.location.hash === '#attendance') {
            showView('attendance');
        }
    </script>
</body>
</html>
