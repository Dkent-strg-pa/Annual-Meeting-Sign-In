name: Deploy to GitHub Pages

on:
  push:
  branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Inject GitHub Token
        run: |
          sed -i "s/GITHUB_TOKEN_PLACEHOLDER/${{ secrets.MY_GITHUB_TOKEN }}/g" index.html
        shell: bash
      
      - name: Setup Pages
        uses: actions/configure-pages@v3
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: '.'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
