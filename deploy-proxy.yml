name: Deploy GitHub Proxy

on:
  push:
    branches: [ main ]
    paths:
      - 'api/github-proxy.js'
      - 'wrangler.toml'
  workflow_dispatch:

jobs:
  deploy-proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
      
      # Note: GITHUB_TOKEN secret must be set manually in Cloudflare Workers dashboard
      # or via: wrangler secret put GITHUB_TOKEN
      # The secret is stored securely in Cloudflare and accessed via env.GITHUB_TOKEN in the worker
